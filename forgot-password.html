<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffd21f">
  <title>DR.Care | نسيت كلمة المرور</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-mark" style="width:64px;height:64px;border-radius:16px;background:var(--yellow);display:inline-flex;align-items:center;justify-content:center;color:#0a0800;font-size:1.4rem;font-weight:900;font-family:'Montserrat',sans-serif;margin-bottom:18px;box-shadow:0 8px 32px rgba(255,210,31,0.35);">DR</div>
        <h1>DR.Care</h1>
        <p>إعادة تعيين كلمة المرور</p>
      </div>

      <!-- Step 1: Enter email -->
      <div id="stepEmail">
        <p style="text-align:center;color:var(--gray);font-size:0.95rem;margin-bottom:1.5rem;line-height:1.6;">
          أدخل بريدك الإلكتروني المسجّل وسنرسل لك رابط إعادة التعيين.
        </p>
        <form id="forgotForm" novalidate>
          <div class="form-group">
            <label for="resetEmail">البريد الإلكتروني</label>
            <input type="email" id="resetEmail" placeholder="your@email.com" autocomplete="email" required>
          </div>
          <button class="auth-btn" type="submit" id="forgotBtn">إرسال رابط الإعادة</button>
          <div class="auth-message" id="forgotMessage" role="status" aria-live="polite"></div>
        </form>
      </div>

      <!-- Step 2: Confirmation -->
      <div id="stepDone" style="display:none;text-align:center;padding:1rem 0;">
        <div style="font-size:3rem;margin-bottom:1rem;">📬</div>
        <h2 style="color:var(--yellow);margin-bottom:.75rem;font-size:1.2rem;">تم الإرسال!</h2>
        <p style="color:var(--gray);line-height:1.7;font-size:0.95rem;">
          إذا كان البريد مسجلاً لدينا، ستصل رسالة تحتوي على رابط إعادة التعيين خلال دقائق.<br>
          تحقق من مجلد Spam إن لم تجدها.
        </p>
      </div>

      <div class="auth-footer">
        <a href="customer-login.html">← العودة لتسجيل الدخول</a>
      </div>
    </div>
  </div>

  <script>
    function showMsg(el, text, type) {
      el.textContent = text;
      el.className = `auth-message show ${type}`;
    }

    document.getElementById('forgotForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('resetEmail').value.trim();
      const msg   = document.getElementById('forgotMessage');
      const btn   = document.getElementById('forgotBtn');

      if (!email) { showMsg(msg, 'أدخل بريدك الإلكتروني.', 'error'); return; }

      btn.disabled = true;
      btn.textContent = 'جاري الإرسال...';

      try {
        const res  = await fetch('api/password-reset.php', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ action: 'request', email })
        });
        const data = await res.json();

        if (data.ok) {
          document.getElementById('stepEmail').style.display = 'none';
          document.getElementById('stepDone').style.display  = 'block';
        } else {
          showMsg(msg, data.message || 'حدث خطأ، حاول مرة أخرى.', 'error');
        }
      } catch {
        showMsg(msg, 'تعذّر الاتصال بالخادم.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'إرسال رابط الإعادة';
      }
    });
  </script>
</body>
</html>
