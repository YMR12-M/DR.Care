<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffd21f">
  <title>DR.Care | تعيين كلمة مرور جديدة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-mark" style="width:64px;height:64px;border-radius:16px;background:var(--yellow);display:inline-flex;align-items:center;justify-content:center;color:#0a0800;font-size:1.4rem;font-weight:900;font-family:'Montserrat',sans-serif;margin-bottom:18px;box-shadow:0 8px 32px rgba(255,210,31,0.35);">DR</div>
        <h1>DR.Care</h1>
        <p id="pageSubtitle">تعيين كلمة مرور جديدة</p>
      </div>

      <!-- Loading state -->
      <div id="stateLoading" style="text-align:center;padding:2rem 0;color:var(--gray);">
        جاري التحقق من الرابط…
      </div>

      <!-- Invalid token -->
      <div id="stateInvalid" style="display:none;text-align:center;padding:1rem 0;">
        <div style="font-size:3rem;margin-bottom:1rem;">⛔</div>
        <h2 style="color:#ff4d4d;margin-bottom:.75rem;font-size:1.1rem;">الرابط غير صالح</h2>
        <p style="color:var(--gray);line-height:1.7;font-size:0.95rem;" id="invalidMsg">
          الرابط منتهي الصلاحية أو استُخدم من قبل.
        </p>
        <a href="forgot-password.html" class="auth-btn" style="display:block;margin-top:1.5rem;text-align:center;text-decoration:none;">طلب رابط جديد</a>
      </div>

      <!-- Reset form -->
      <div id="stateForm" style="display:none;">
        <p style="text-align:center;color:var(--gray);font-size:0.9rem;margin-bottom:1.25rem;" id="emailHint"></p>
        <form id="resetForm" novalidate>
          <div class="form-group">
            <label for="newPassword">كلمة المرور الجديدة</label>
            <input type="password" id="newPassword" placeholder="6 أحرف على الأقل" autocomplete="new-password" required>
          </div>
          <div class="form-group">
            <label for="confirmPassword">تأكيد كلمة المرور</label>
            <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password" required>
          </div>
          <button class="auth-btn" type="submit" id="resetBtn">تعيين كلمة المرور</button>
          <div class="auth-message" id="resetMessage" role="status" aria-live="polite"></div>
        </form>
      </div>

      <!-- Success state -->
      <div id="stateSuccess" style="display:none;text-align:center;padding:1rem 0;">
        <div style="font-size:3rem;margin-bottom:1rem;">✅</div>
        <h2 style="color:var(--yellow);margin-bottom:.75rem;font-size:1.2rem;">تم التغيير بنجاح!</h2>
        <p style="color:var(--gray);line-height:1.7;font-size:0.95rem;">
          كلمة مرورك الجديدة جاهزة. سيتم تحويلك لصفحة تسجيل الدخول…
        </p>
      </div>

      <div class="auth-footer">
        <a href="customer-login.html">← العودة لتسجيل الدخول</a>
      </div>
    </div>
  </div>

  <script>
    const token = new URLSearchParams(location.search).get('token') || '';

    function showState(id) {
      ['stateLoading','stateInvalid','stateForm','stateSuccess'].forEach(s => {
        document.getElementById(s).style.display = s === id ? 'block' : 'none';
      });
    }

    function showMsg(el, text, type) {
      el.textContent = text;
      el.className = `auth-message show ${type}`;
    }

    async function verifyToken() {
      if (!token || token.length !== 64) {
        document.getElementById('invalidMsg').textContent = 'رابط غير صالح أو ناقص.';
        showState('stateInvalid');
        return;
      }

      try {
        const res  = await fetch('api/password-reset.php', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ action: 'verify', token })
        });
        const data = await res.json();

        if (data.ok) {
          document.getElementById('emailHint').textContent = 'حساب: ' + data.email;
          showState('stateForm');
        } else {
          document.getElementById('invalidMsg').textContent = data.message || 'الرابط منتهي الصلاحية.';
          showState('stateInvalid');
        }
      } catch {
        document.getElementById('invalidMsg').textContent = 'تعذّر الاتصال بالخادم.';
        showState('stateInvalid');
      }
    }

    document.getElementById('resetForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('newPassword').value;
      const confirm  = document.getElementById('confirmPassword').value;
      const msg      = document.getElementById('resetMessage');
      const btn      = document.getElementById('resetBtn');

      if (password.length < 6) { showMsg(msg, 'كلمة المرور يجب أن تكون 6 أحرف على الأقل.', 'error'); return; }
      if (password !== confirm) { showMsg(msg, 'كلمتا المرور غير متطابقتين.', 'error'); return; }

      btn.disabled = true;
      btn.textContent = 'جاري الحفظ...';

      try {
        const res  = await fetch('api/password-reset.php', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ action: 'reset', token, password })
        });
        const data = await res.json();

        if (data.ok) {
          showState('stateSuccess');
          setTimeout(() => { window.location.href = 'customer-login.html'; }, 2500);
        } else {
          showMsg(msg, data.message || 'حدث خطأ، حاول مرة أخرى.', 'error');
          if (data.message?.includes('منتهي') || data.message?.includes('استُخدم')) {
            setTimeout(() => showState('stateInvalid'), 2000);
          }
        }
      } catch {
        showMsg(msg, 'تعذّر الاتصال بالخادم.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'تعيين كلمة المرور';
      }
    });

    verifyToken();
  </script>
</body>
</html>
